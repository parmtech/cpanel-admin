name: Android foundation

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org au.parmtech --project-name cpanel_admin .

      - name: Add Android internet permission
        run: python3 tool/ensure_android_internet.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze application source
        run: flutter analyze lib

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-admin-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
